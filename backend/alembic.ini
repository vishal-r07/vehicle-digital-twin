# ============================================================================
# AutoTwin AI - Alembic Database Migration Configuration
# ============================================================================
# Usage:
#   alembic upgrade head          → Apply all migrations
#   alembic downgrade -1          → Rollback one migration
#   alembic revision --autogenerate -m "description"  → Create new migration
#   alembic history               → Show migration history
#   alembic current               → Show current revision
# ============================================================================

[alembic]
# Path to migration scripts (relative to this file)
script_location = alembic

# Template used to generate migration file names
# Format: revision_id_description.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for file_template timestamps
timezone = UTC

# Maximum length for migration slug (description in filename)
truncate_slug_length = 60

# Set to 'true' to run migrations in an online environment
# (requires database URL)
# revision_environment = false

# Database connection URL
# SQLite (Phase 1 — single file, zero config)
sqlalchemy.url = sqlite:///./autotwin.db

# For PostgreSQL (Phase 2+):
# sqlalchemy.url = postgresql+psycopg2://autotwin:password@localhost:5432/autotwin_db

# For async SQLite (used with aiosqlite):
# sqlalchemy.url = sqlite+aiosqlite:///./autotwin.db

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %Y-%m-%d %H:%M:%S

# ============================================================================
# AUTOGENERATE SETTINGS
# ============================================================================

[post_write_hooks]
# Format migration files with black after generation
