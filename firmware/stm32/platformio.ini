; ============================================================================
; AutoTwin AI - Vehicle Digital Twin Platform
; ============================================================================
; PlatformIO Build Configuration
; Target: STM32F103RB Nucleo-64 + MCP2515 CAN Module
; ============================================================================

; ============================================================================
; PLATFORM DEFAULTS
; ============================================================================

[platformio]
default_envs = nucleo_f103rb
src_dir = AutoTwinCAN
description = AutoTwin AI CAN Interface Firmware

; ============================================================================
; COMMON BUILD SETTINGS
; ============================================================================

[common]
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_flags =
    ; Optimization
    -Os
    ; Warnings
    -Wall
    -Wextra
    -Wno-unused-parameter
    ; C++ standard
    -std=c++14
    ; AutoTwin AI specific defines
    -D AUTOTWIN_FW
    -D FW_VERSION_MAJOR=2
    -D FW_VERSION_MINOR=0
    -D FW_VERSION_PATCH=0
    ; Enable printf float support (needed for SERIAL_PORT.printf with floats)
    -u _printf_float
    ; STM32 HAL optimizations
    -D HAL_UART_MODULE_ENABLED
    -D HAL_SPI_MODULE_ENABLED
    -D HAL_GPIO_MODULE_ENABLED
lib_deps =
    ; SPI is included in STM32 Arduino Core (no external dep needed)
    ; Add external libraries here if needed in future:
    ; adafruit/Adafruit MCP2515 @ ^1.0.0

; ============================================================================
; ENVIRONMENT: Nucleo F103RB (Primary Target)
; ============================================================================

[env:nucleo_f103rb]
platform = ststm32
board = nucleo_f103rb
framework = ${common.framework}

; Serial Monitor
monitor_speed = ${common.monitor_speed}
monitor_filters =
    colorize
    time
    send_on_enter

; Upload Configuration (ST-Link)
upload_protocol = stlink
upload_speed = ${common.upload_speed}

; Debug Configuration
debug_tool = stlink
debug_init_break = tbreak setup
debug_speed = 4000

; Build Flags
build_flags =
    ${common.build_flags}
    ; Board-specific: Enable SPI1 on PA5/PA6/PA7
    -D ENABLE_HWSERIAL1
    ; CAN via MCP2515 (SPI), not built-in CAN peripheral
    -D USE_MCP2515_SPI
    ; LED pin definitions (override if needed)
    -D LED_STATUS_PIN=PB5
    -D LED_ERROR_PIN=PB4
    -D LED_CAN_ACTIVE_PIN=PB3
    ; MCP2515 CS and INT pins
    -D MCP2515_CS_PIN=PA4
    -D MCP2515_INT_PIN=PB0

; Library Dependencies
lib_deps =
    ${common.lib_deps}

; Extra scripts (pre/post build)
; extra_scripts = pre:scripts/pre_build.py

; ============================================================================
; ENVIRONMENT: Nucleo F103RB - Debug Build
; ============================================================================

[env:nucleo_f103rb_debug]
platform = ststm32
board = nucleo_f103rb
framework = ${common.framework}
build_type = debug

monitor_speed = ${common.monitor_speed}
upload_protocol = stlink
debug_tool = stlink

build_flags =
    ${common.build_flags}
    -D DEBUG
    -D DEBUG_LEVEL=3
    -D SERIAL_DEBUG_ENABLED=1
    -D ENABLE_HWSERIAL1
    -D USE_MCP2515_SPI
    -D LED_STATUS_PIN=PB5
    -D LED_ERROR_PIN=PB4
    -D LED_CAN_ACTIVE_PIN=PB3
    -D MCP2515_CS_PIN=PA4
    -D MCP2515_INT_PIN=PB0
    ; Debug optimizations (less optimization for debugging)
    -Og
    -g3
    -ggdb

lib_deps =
    ${common.lib_deps}

; ============================================================================
; ENVIRONMENT: Nucleo F103RB - Release Build
; ============================================================================

[env:nucleo_f103rb_release]
platform = ststm32
board = nucleo_f103rb
framework = ${common.framework}
build_type = release

monitor_speed = ${common.monitor_speed}
upload_protocol = stlink

build_flags =
    ${common.build_flags}
    -D NDEBUG
    -D SERIAL_DEBUG_ENABLED=0
    -D ENABLE_HWSERIAL1
    -D USE_MCP2515_SPI
    -D LED_STATUS_PIN=PB5
    -D LED_ERROR_PIN=PB4
    -D LED_CAN_ACTIVE_PIN=PB3
    -D MCP2515_CS_PIN=PA4
    -D MCP2515_INT_PIN=PB0
    ; Maximum optimization for release
    -O2
    ; Link-time optimization
    -flto
    ; Strip unused sections
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections

lib_deps =
    ${common.lib_deps}

; ============================================================================
; ENVIRONMENT: Generic STM32F103 (Blue Pill - alternative board)
; ============================================================================

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = ${common.framework}

monitor_speed = ${common.monitor_speed}
upload_protocol = stlink

build_flags =
    ${common.build_flags}
    -D ENABLE_HWSERIAL1
    -D USE_MCP2515_SPI
    ; Blue Pill has different pin layout
    -D LED_STATUS_PIN=PC13
    -D LED_ERROR_PIN=PB7
    -D LED_CAN_ACTIVE_PIN=PB6
    -D MCP2515_CS_PIN=PA4
    -D MCP2515_INT_PIN=PB0

lib_deps =
    ${common.lib_deps}

; ============================================================================
; ENVIRONMENT: Loopback Test (No hardware needed)
; ============================================================================

[env:nucleo_f103rb_loopback]
platform = ststm32
board = nucleo_f103rb
framework = ${common.framework}

monitor_speed = ${common.monitor_speed}
upload_protocol = stlink

build_flags =
    ${common.build_flags}
    -D DEBUG
    -D FEATURE_LOOPBACK_TEST=1
    -D SERIAL_DEBUG_ENABLED=1
    -D ENABLE_HWSERIAL1
    -D USE_MCP2515_SPI
    -D LED_STATUS_PIN=PB5
    -D LED_ERROR_PIN=PB4
    -D LED_CAN_ACTIVE_PIN=PB3
    -D MCP2515_CS_PIN=PA4
    -D MCP2515_INT_PIN=PB0

lib_deps =
    ${common.lib_deps}

; ============================================================================
; ENVIRONMENT: Native Test (Compile on PC, no hardware)
; ============================================================================

[env:native_test]
platform = native
build_flags =
    -std=c++14
    -D UNIT_TEST
    -D ARDUINO=100
    ; Mock Arduino functions for testing
    -I test/mocks
lib_deps =
    throwtheswitch/Unity @ ^2.5.2
test_framework = unity
test_build_src = true

; ============================================================================
; CUSTOM UPLOAD COMMANDS
; ============================================================================

; Upload and immediately open serial monitor:
;   pio run -t upload && pio device monitor

; Upload specific environment:
;   pio run -e nucleo_f103rb -t upload

; Build without upload:
;   pio run -e nucleo_f103rb

; Clean build:
;   pio run -t clean

; Run unit tests:
;   pio test -e native_test

; ============================================================================
; SERIAL MONITOR SETTINGS
; ============================================================================

; To use with Arduino IDE instead of PlatformIO:
;   Board: Generic STM32F103RB
;   Upload Method: STLink
;   USB Support: CDC (generic 'Serial')
;   Optimize: Smallest (-Os)
;   C++ Standard: C++14

; ============================================================================
; NOTES
; ============================================================================

; MCP2515 Wiring (SPI1):
;   MOSI = PA7 (CN10-15)
;   MISO = PA6 (CN10-13)
;   SCK  = PA5 (CN10-11) [shared with onboard LED]
;   CS   = PA4 (CN10-9)
;   INT  = PB0 (CN7-28)
;
; External LEDs:
;   Status LED  = PB5 (CN10-4)
;   Error LED   = PB4 (CN10-6)
;   CAN Active  = PB3 (CN10-8)
;
; USB Serial:
;   Via ST-Link VCP (Virtual COM Port)
;   Appears as /dev/ttyACM0 (Linux) or COMx (Windows)
;
; CAN Bus:
;   MCP2515 CANH → Bus High
;   MCP2515 CANL → Bus Low
;   120Ω termination at both ends
;   Baud rate: 500 kbps