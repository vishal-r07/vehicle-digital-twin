; PlatformIO Configuration for STM32F103 Nucleo
; Alternative build system - can also use Arduino IDE

[env:nucleo_f103rb]
platform = ststm32
board = nucleo_f103rb
framework = arduino
monitor_speed = 115200
upload_protocol = stlink
build_flags = 
    -D ENABLE_HWSERIAL1
    -D PIN_CAN_RX=PB8
    -D PIN_CAN_TX=PB9
lib_deps =
    ; STM32 Arduino Core includes HardwareCAN